[package]
name = "relvi"
version = "0.1.1"
edition = "2024"
description = "A focused launcher for Wayland"
repository = "https://github.com/so1ve/relvi"
license = "MIT"

[workspace]
resolver = "3"
members = ["xtask"]
default-members = ["."]

[workspace.dependencies]
clap = { version = "4.6", features = ["derive"] }
emojis = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dependencies]
adw = { package = "libadwaita", version = "0.9", features = ["v1_2"] }
async-channel = "2.5"
clap.workspace = true
clap_complete = "4.6"
emojis.workspace = true
gio-unix = "0.22"
glib = { version = "0.22", features = ["v2_72"] }
gtk = { package = "gtk4", version = "0.11", features = ["v4_12"] }
gtk4-layer-shell = "0.8.1"
polysearch = { version = "0.3.1", features = ["pinyin"] }
serde = { workspace = true, features = ["rc"] }
serde_json.workspace = true
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt"] }
wl-clipboard-watch = "0.1"

[lints.clippy]
all = { level = "warn", priority = -1 }
clone_on_ref_ptr = "warn"
default_trait_access = "warn"
disallowed_methods = "warn"
enum_glob_use = "warn"
fn_params_excessive_bools = "warn"
format_collect = "warn"
format_push_string = "warn"
implicit_clone = "warn"
items_after_statements = "warn"
manual_let_else = "warn"
manual_string_new = "warn"
match_same_arms = "warn"
match_wildcard_for_single_variants = "warn"
missing_const_for_fn = "warn"
must_use_candidate = "warn"
needless_pass_by_value = "warn"
new_without_default = "allow"
redundant_pub_crate = "warn"
semicolon_if_nothing_returned = "warn"
single_match_else = "warn"
struct_excessive_bools = "warn"
undocumented_unsafe_blocks = "warn"
uninlined_format_args = "warn"
unnecessary_literal_bound = "warn"
use_self = "warn"
verbose_file_reads = "warn"
wildcard_imports = "warn"

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
