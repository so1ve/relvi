name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  pull-requests: write

jobs:
  release-pr:
    name: Prepare release
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    uses: so1ve/workflows/.github/workflows/rust-release.yml@v1
    with:
      toolchain: nightly
      runs-on: ubuntu-26.04
      command: release-pr
      setup: .github/actions/setup-rust-ci

  release:
    name: Publish release
    uses: so1ve/workflows/.github/workflows/rust-release.yml@v1
    with:
      toolchain: nightly
      runs-on: ubuntu-26.04
      command: release
      setup: .github/actions/setup-rust-ci

  release-binary:
    name: Release Binary ${{ matrix.target }}
    needs: release
    if: ${{ needs.release.outputs.releases != '' && needs.release.outputs.releases != '[]' }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-26.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_TAG: ${{ fromJSON(needs.release.outputs.releases)[0].tag }}
    steps:
      - uses: so1ve/workflows/setup-rust@v1
        with:
          toolchain: nightly
      - name: Checkout release tag
        run: |
          git fetch --depth=1 origin "refs/tags/$RELEASE_TAG"
          git checkout --detach FETCH_HEAD
      - uses: ./.github/actions/setup-rust-ci
      - run: cargo build --locked --release
      - run: mv target/release/relvi "relvi-${{ matrix.target }}"
      - name: Upload binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" "relvi-${{ matrix.target }}" --clobber
